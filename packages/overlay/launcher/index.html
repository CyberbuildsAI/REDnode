<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REDnode launcher</title>
<script src="rednode://ui/rednode-ui.js"></script>
<style>
  /* Collapsed, only the tab at the bottom is drawn; the rest is transparent
     and clicks through to the game. Expanded, the app list opens above it. */
  html, body { margin: 0; width: 380px; height: 560px; overflow: hidden; background: transparent; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  rn-window { width: 380px; max-height: 500px; }
  rn-window[hidden] { display: none; }
  .dock { padding-bottom: 2px; }
  /* The tab stays visible over the game, so it gets a dark backing. */
  .tab { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; background: var(--rn-bg); }
  .solo { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 0 0 0 6px; border-left: 2px solid var(--rn-accent);
    font: 700 10px var(--rn-mono); color: var(--rn-accent); white-space: nowrap; }
  /* The tab must fit the launcher's width: a long name is cut with an ellipsis. */
  .solo #solo-name { display: inline-block; max-width: 84px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .solo[hidden] { display: none; }
  .solo rn-button::part(button) { min-height: 22px; padding: 2px 8px; font-size: 11px; }
  .grip { width: 14px; height: 34px; cursor: move;
    background: repeating-linear-gradient(0deg, var(--rn-accent) 0 2px, transparent 2px 6px); opacity: .7; }
  .app { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--rn-line); }
  .app:last-child { border-bottom: 0; }
  .name { font: 700 15px var(--rn-display); letter-spacing: .06em; text-transform: uppercase; }
  .meta { font: 11px var(--rn-mono); color: var(--rn-dim); letter-spacing: .06em; }
  .desc { grid-column: 1 / -1; font-size: 14px; color: var(--rn-dim); }
  .empty { color: var(--rn-dim); font-size: 14px; }
  .status { font: 11px var(--rn-mono); letter-spacing: .1em; color: var(--rn-dim); }
  .status b { color: var(--rn-ok); font-weight: 500; }
  .status b.off { color: var(--rn-danger); }
  #rn-notifications { bottom: auto !important; top: 8px; }
  .footer { display: flex; flex-direction: column; gap: 8px; padding: 8px 14px 10px; border-top: 1px solid var(--rn-line); }
  .switches { display: flex; gap: 18px; }
  .themes { display: flex; align-items: center; gap: 6px; }
  /* Spaces: the one shown now, and making, renaming and deleting them. */
  .spaces, .space-edit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .spaces .label { font: 600 11px var(--rn-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rn-dim); margin-right: 4px; }
  .spaces .now { font: 700 13px var(--rn-mono); color: var(--rn-accent-2); margin-right: 4px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spaces rn-button::part(button), .space-edit rn-button::part(button), #space-switch::part(button) { min-height: 28px; padding: 4px 10px; font-size: 12px; }
  .space-edit rn-input { flex: 1; min-width: 0; }
  #space-switch::part(button) { min-height: 26px; color: var(--rn-accent-2); }
  #space-tab { display: inline-block; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  .space-error { font: 12px var(--rn-mono); color: var(--rn-danger); }
  .rn-window-menu .key { margin-left: auto; font: 11px var(--rn-mono); color: var(--rn-dim); }
  .version { text-align: right; font: 10px var(--rn-mono); letter-spacing: .12em; color: var(--rn-dim); opacity: .8; }
  .themes .label { font: 600 11px var(--rn-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rn-dim); margin-right: 4px; }
  .themes rn-button::part(button) { min-height: 28px; padding: 4px 10px; font-size: 12px; }
  .mod { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .status-line { font: 11px var(--rn-mono); letter-spacing: .08em; color: var(--rn-dim); }
  .st { font-weight: 500; }
  .st-running { color: var(--rn-ok); }
  .st-starting { color: var(--rn-accent-2); }
  .st-crashed, .st-not-responding { color: var(--rn-danger); }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .err { font: 11px/1.35 var(--rn-mono); color: var(--rn-danger); white-space: pre-wrap; word-break: break-word; }
  .more { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; margin-bottom: 8px;
    font: 11px var(--rn-mono); color: var(--rn-dim); border: 1px dashed var(--rn-line); }
  .more rn-button::part(button) { min-height: 22px; padding: 2px 8px; font-size: 11px; }
  .closed-line { display: flex; align-items: center; gap: 8px; font: 11px var(--rn-mono); color: var(--rn-dim); }
  .closed-line rn-button::part(button) { min-height: 22px; padding: 2px 8px; font-size: 11px; }
  .log { font: 11px/1.35 var(--rn-mono); color: var(--rn-dim); white-space: pre-wrap; word-break: break-word;
    max-height: 70px; overflow: hidden; border-left: 2px solid var(--rn-line); padding-left: 8px; }
  .perm { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 8px; margin-top: 4px; border-left: 2px solid var(--rn-accent-2); background: var(--rn-panel); }
  .perm-what { font-size: 13px; color: var(--rn-fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="dock">
    <rn-window id="panel" title="REDnode apps and mods" no-rollup hidden>
      <span class="status" slot="status">GAME <b id="link" class="off">OFF</b></span>
      <div class="more" id="more" hidden><span id="more-text"></span><rn-button id="more-open" variant="ghost">Open</rn-button></div>
      <div id="apps"><p class="empty">Looking for apps...</p></div>
      <div slot="footer" class="footer">
        <div class="switches">
          <rn-toggle id="gpu" label="GPU sharing"></rn-toggle>
          <rn-toggle id="hot" label="Hot reload"></rn-toggle>
        </div>
        <div class="switches">
          <rn-toggle id="mcp" label="MCP server"></rn-toggle>
          <rn-button id="mcp-copy" variant="ghost">Copy setup</rn-button>
        </div>
        <div class="switches">
          <rn-toggle id="dev" label="Developer mode"></rn-toggle>
          <rn-toggle id="start" label="Open at start" title="Off: the game starts with only HUD widgets showing, until you press F10"></rn-toggle>
        </div>
        <div class="spaces">
          <span class="label">Space</span>
          <span class="now" id="space-now">Main</span>
          <rn-button id="space-new" variant="ghost">New</rn-button>
          <rn-button id="space-rename" variant="ghost">Rename</rn-button>
          <rn-button id="space-delete" variant="ghost">Delete</rn-button>
        </div>
        <div class="space-edit" id="space-edit" hidden>
          <rn-input id="space-input" placeholder="Space name, then Enter"></rn-input>
          <rn-button id="space-cancel" variant="ghost">Cancel</rn-button>
        </div>
        <div class="space-error" id="space-error" hidden></div>
        <div class="themes">
          <span class="label">Theme</span>
          <rn-button data-theme="rednode" variant="ghost">REDnode</rn-button>
          <rn-button data-theme="hud" variant="ghost">HUD red</rn-button>
          <rn-button data-theme="edge" variant="ghost">EDGE</rn-button>
        </div>
        <div class="version" id="version"></div>
      </div>
    </rn-window>
    <div class="tab">
      <div class="grip" data-rednode-drag title="Drag to move"></div>
      <rn-button id="toggle" variant="ghost">REDnode <span id="count"></span></rn-button>
      <rn-button id="space-switch" variant="ghost" hidden title="Switch space (Ctrl+1 to 9 in the overlay)">&#x25BE; <span id="space-tab"></span></rn-button>
      <div class="solo" id="solo" hidden title="Solo mode: this package hid the other packages' windows">
        <span>SOLO <span id="solo-name"></span></span><rn-button id="solo-end" variant="ghost">End</rn-button>
      </div>
    </div>
  </div>
<script src="app.js"></script>
</body>
</html>
