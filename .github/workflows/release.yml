# Builds the REDnode player zip: the plugin, its scripts, the packaged overlay host and the
# samples, laid out like the game folder (tools/release/nexus-zip.mjs). The same zip goes to
# Nexus Mods (uploaded by hand) and to the GitHub release.
#
#   Run workflow (Actions tab)                  builds the zip and keeps it as the run's artifact
#   Run workflow, "Make a release" ticked       also tags the commit v<VERSION> and makes the
#                                               GitHub release with the zip; stops first if that
#                                               tag exists (raise VERSION with tools/version.mjs)
name: Release zip

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<VERSION>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  zip:
    # VS 2022's toolset, as on the dev machine (docs/dev-setup.md): players' Visual C++ runtimes cover it.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh api "repos/${{ github.repository }}/git/ref/tags/v$version" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::v$version is already released. Raise VERSION with node tools/version.mjs <version>."
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # the packager fetches its own Electron

      - name: Build the plugin and run its unit tests
        run: .\tools\build-native.ps1

      - name: Package the overlay host
        run: npm run overlay:package

      - name: Build the zip
        run: npm run release:zip

      - uses: actions/upload-artifact@v4
        with:
          name: REDnode-zip
          path: native/build/release/REDnode-*.zip
          if-no-files-found: error

      - name: GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $notes = "REDnode $version. Install: extract into the game folder, or add the zip to Vortex or REDdeck. Needs RED4ext and redscript. Docs: https://edgemodders.github.io/REDnode/"
          gh release create "v$version" "native/build/release/REDnode-$version.zip" --target $env:GITHUB_SHA --title "REDnode $version" --notes $notes --generate-notes
