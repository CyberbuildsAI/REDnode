# Builds the docs site and deploys it to GitHub Pages.
#   1. TypeDoc generates the API reference into docs/api (never committed).
#   2. tools/gameapi/build.mjs generates the game API reference into docs/game
#      from gameapi/<version>/rtti.json and gameapi/notes (never committed).
#   3. Jekyll renders docs/ with the HUD layout and copies docs/api and docs/game as-is.
#   4. The result is deployed to https://edgemodders.github.io/REDnode/
# Requires Settings > Pages > Source: GitHub Actions.

name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # the overlay host is not needed to build the docs

      - name: Generate API reference
        run: npm run docs:api

      - name: Generate game API reference
        run: npm run docs:game

      - uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
