# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# design.html is a standalone page and is served as-is.
# Built and deployed by .github/workflows/pages.yml, which first generates the API reference into docs/api.

title: REDnode
url: https://edgemodders.github.io
baseurl: /REDnode
repo: https://github.com/Edgemodders/REDnode

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: API
    url: /api/
  - title: Game API
    url: /game/
  - title: Design
    url: /design.html
  - title: Overlay
    url: /overlay.html
  - title: Overlay apps
    url: /overlay-apps.html
  - title: MCP server
    url: /mcp.html
  - title: World API
    url: /world.html
  - title: TweakDB API
    url: /tweakdb.html
  - title: P0 findings
    url: /p0-findings.html
  - title: P1 results
    url: /p1-results.html
  - title: Dev setup
    url: /dev-setup.html
